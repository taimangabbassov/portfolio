<title>Тайман Габбасов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Layout: визитка по центру: приветствие, крупная должность, аватар, строка вопроса, 5 плиток-разделов; под ними панель выбранного раздела. Фон: мягкие цветные «дымные» пятна и водяной знак-фамилия. */
:root{
  --bg:#ffffff;
  --ink:#0d0f14;
  --muted:#5d6472;
  --line:#e6e8ee;
  --surface:#ffffff;
  --surface-2:#f6f7fa;
  --accent:#3b82f6;
  --blob1:#f3a6e6; --blob2:#a9b8ff; --blob3:#ffd2a8; --blob4:#9de7e1;
  --mark:#f1f2f5;
  --ok:#16865a;
  --f:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b0d12; --ink:#eef1f6; --muted:#9aa3b2; --line:#252a35; --surface:#12151c; --surface-2:#171b24;
    --accent:#6ea2ff; --blob1:#7d3a76; --blob2:#3a4690; --blob3:#7a4a25; --blob4:#1f6a66; --mark:#141820; --ok:#4cc488;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b0d12; --ink:#eef1f6; --muted:#9aa3b2; --line:#252a35; --surface:#12151c; --surface-2:#171b24;
  --accent:#6ea2ff; --blob1:#7d3a76; --blob2:#3a4690; --blob3:#7a4a25; --blob4:#1f6a66; --mark:#141820; --ok:#4cc488;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--f); font-size:16px; line-height:1.55;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 56px; overflow-x:hidden; position:relative;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px}

/* фон */
.bg{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden}
.blob{position:absolute; border-radius:50%; filter:blur(90px); opacity:.25}
#fx{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
#fx.soft{filter:blur(16px) saturate(1.25)}
:root{--fx-blend:multiply}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--fx-blend:screen}}
:root[data-theme="dark"]{--fx-blend:screen}
#fx{mix-blend-mode:var(--fx-blend)}
.b1{width:520px; height:520px; left:-160px; top:-120px; background:var(--blob1)}
.b2{width:420px; height:420px; left:60px; top:220px; background:var(--blob2); opacity:.4}
.b3{width:360px; height:360px; right:-120px; top:-80px; background:var(--blob3); opacity:.35}
.b4{width:380px; height:380px; right:-60px; bottom:-140px; background:var(--blob4); opacity:.35}
@media (prefers-reduced-motion:no-preference){
  @keyframes float1{to{transform:translate(80px,60px) scale(1.12)}}
  @keyframes float2{to{transform:translate(-60px,80px) scale(.92)}}
}
.watermark{position:absolute; left:0; right:0; top:560px; text-align:center; overflow:hidden; z-index:0; pointer-events:none;
  font-weight:800; font-size:clamp(60px,18vw,260px); letter-spacing:-.04em; color:var(--mark); white-space:nowrap; line-height:1}

main{position:relative; z-index:1; max-width:960px; margin:0 auto}

/* hero */
.hero{display:grid; justify-items:center; text-align:center; gap:6px; padding-top:48px}
.hello{font-size:clamp(20px,3vw,28px); font-weight:500; margin:0}
.hello .wave{display:inline-block; transform-origin:70% 70%}
@media (prefers-reduced-motion:no-preference){.hello .wave{animation:wave 2.4s ease-in-out 1s 2}}
@keyframes wave{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(14deg)}20%,40%{transform:rotate(-8deg)}}
h1{font-size:clamp(42px,9vw,92px); font-weight:800; line-height:1; letter-spacing:-.035em; margin:6px 0 0; text-wrap:balance}
.avatar{margin-top:26px; width:clamp(170px,26vw,230px); aspect-ratio:1; max-width:100%; border-radius:50%;
  display:grid; place-items:center; position:relative;
  background:radial-gradient(circle at 30% 25%, var(--blob2), transparent 60%), radial-gradient(circle at 75% 80%, var(--blob1), transparent 55%), var(--surface-2);
  border:1px solid var(--line); box-shadow:0 20px 50px -25px rgba(30,40,80,.35); overflow:hidden}
.avatar span{font-weight:800; font-size:clamp(54px,8vw,76px); letter-spacing:-.04em}
.avatar img{width:100%; height:100%; object-fit:cover; border-radius:50%}

/* вопрос */
.ask{margin:34px auto 0; width:min(640px,100%); position:relative}
.ask form{display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 6px 6px 22px; box-shadow:0 8px 30px -18px rgba(30,40,80,.3)}
.ask input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:inherit; font-size:16px; padding:10px 0}
.ask input::placeholder{color:var(--muted)}
.send{width:46px; height:46px; flex:none; border-radius:50%; border:0; background:var(--accent); color:#fff; cursor:pointer; display:grid; place-items:center}
.send svg{width:20px; height:20px}
.chips{display:flex; flex-wrap:wrap; justify-content:center; gap:8px; margin-top:12px}
.chip{font:inherit; font-size:13px; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer}
.chip:hover{color:var(--ink); border-color:var(--muted)}
.answer{margin-top:14px; background:var(--surface); border:1px solid var(--line); border-radius:18px; padding:16px 18px; text-align:left}
.answer .q{font-size:13px; color:var(--muted); margin-bottom:6px}
.answer p{margin:0; white-space:pre-line}
.hint{font-size:12px; color:var(--muted); text-align:center; margin-top:8px}

/* плитки */
.tiles{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; margin:28px auto 0; width:min(960px,100%)}
.tile{font:inherit; color:var(--ink); background:color-mix(in srgb, var(--surface) 90%, transparent);
  border:1px solid var(--line); border-radius:18px; padding:20px 10px; cursor:pointer; display:grid; justify-items:center; gap:8px; font-weight:500}
.tile svg{width:22px; height:22px}
.tile[aria-selected="true"]{border-color:var(--ink); box-shadow:0 10px 30px -18px rgba(30,40,80,.45)}
@media (prefers-reduced-motion:no-preference){.tile{transition:transform .15s ease, border-color .15s}.tile:hover{transform:translateY(-2px)}}
.i-path{color:#0ea5e9}.i-me{color:#14b8a6}.i-pr{color:#16a34a}.i-sk{color:#6366f1}.i-ai{color:#db2777}.i-ct{color:#d97706}

/* панель */
.panel{margin:22px auto 0; width:min(960px,100%); background:var(--surface); border:1px solid var(--line); border-radius:22px; padding:clamp(18px,3vw,30px)}
.panel h2{font-size:24px; font-weight:700; margin:0 0 4px; letter-spacing:-.01em}
.panel .sub{color:var(--muted); margin:0 0 18px}
.panel p{max-width:66ch}
.facts{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:16px 0 0}
.fact{background:var(--surface-2); border-radius:14px; padding:12px 14px}
.fact b{display:block; font-size:22px; font-weight:700; font-variant-numeric:tabular-nums}
.fact span{font-size:13px; color:var(--muted); line-height:1.3; display:block}
.proj{display:grid; gap:12px}
.pcard{background:var(--surface-2); border-radius:16px; padding:16px 18px; display:grid; gap:6px}
.pcard .where{font-size:12px; color:var(--muted)}
.pcard h3{margin:0; font-size:17px; font-weight:600}
.pcard p{margin:0; color:var(--muted); font-size:15px}
.res{display:flex; flex-wrap:wrap; gap:6px; margin-top:4px}
.res span{font-size:13px; font-weight:600; background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:3px 10px; font-variant-numeric:tabular-nums}
.groups{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:16px}
.group h3{font-size:14px; font-weight:600; margin:0 0 8px; color:var(--muted); letter-spacing:.02em}
.tags{display:flex; flex-wrap:wrap; gap:6px}
.tag{font-size:13px; background:var(--surface-2); border-radius:999px; padding:4px 11px}
.list{margin:0; padding-left:20px; display:grid; gap:8px; max-width:66ch}
.contact-row{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:10px}
.contact-row code{font-family:inherit; font-size:15px; background:var(--surface-2); border-radius:10px; padding:8px 12px; user-select:all}
.copy{font:inherit; font-size:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:8px 12px; cursor:pointer}
.ok{font-size:13px; color:var(--ok)}


/* путь */
.scale{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; margin:6px 0 26px}
.scale div{background:var(--surface-2); border-radius:14px; padding:12px 14px; position:relative}
.scale div:not(:last-child)::after{content:"→"; position:absolute; right:-9px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:14px; z-index:1}
.scale b{display:block; font-size:20px; font-weight:700; font-variant-numeric:tabular-nums; line-height:1.15}
.scale span{font-size:12.5px; color:var(--muted); line-height:1.3; display:block; margin-top:4px}
.path{position:relative; display:grid; gap:0; margin-left:8px; border-left:2px solid var(--line)}
.stage{position:relative; padding:0 0 30px 26px}
.stage:last-child{padding-bottom:4px}
.stage::before{content:""; position:absolute; left:-9px; top:4px; width:16px; height:16px; border-radius:50%; background:var(--surface); border:3px solid var(--dot, var(--accent))}
.stage.now::before{background:var(--dot)}
.when{font-size:12.5px; color:var(--muted); font-variant-numeric:tabular-nums}
.stage h3{margin:2px 0 2px; font-size:19px; font-weight:700; letter-spacing:-.01em}
.lvl{display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; background:var(--surface-2); margin:4px 0 8px}
.stage p{margin:0 0 10px; color:var(--ink)}
.nums{display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px}
.nums span{font-size:13px; background:var(--surface-2); border-radius:8px; padding:4px 9px; font-variant-numeric:tabular-nums}
.nums b{font-weight:700}
.learn{font-size:13.5px; color:var(--muted); margin:0}
.learn b{color:var(--ink); font-weight:600}
.next{background:var(--surface-2); border-radius:16px; padding:16px 18px; margin-top:8px}
.next b{display:block; margin-bottom:4px}
@media (max-width:760px){ .scale{grid-template-columns:repeat(2,minmax(0,1fr))} .scale div::after{display:none} }
@media (max-width:760px){ .tiles{grid-template-columns:repeat(3,minmax(0,1fr))} }


/* переключатель языка */
.lang{position:fixed; z-index:5; top:calc(14px + env(safe-area-inset-top, 0px)); right:max(16px, env(safe-area-inset-right, 0px));
  display:flex; gap:2px; padding:4px; border-radius:999px; background:color-mix(in srgb, var(--surface) 92%, transparent); border:1px solid var(--line)}
.lang button{font:inherit; font-size:13px; font-weight:600; letter-spacing:.02em; color:var(--muted); background:transparent; border:0; border-radius:999px; padding:6px 11px; cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink); color:var(--bg)}


.bpmn-box{background:#fff; border:1px solid var(--line); border-radius:12px; overflow:auto; margin-top:8px; max-height:460px}
.bpmn-box svg{display:block; width:1800px; max-width:none; height:auto}


.face{margin-top:22px; width:clamp(150px,19vw,215px)}
.face img{display:block; width:100%; height:auto}
.face{filter:drop-shadow(0 18px 24px rgba(30,40,80,.18))}
@media (prefers-reduced-motion:no-preference){ .face{animation:bob 6s ease-in-out infinite} @keyframes bob{50%{transform:translateY(-6px)}} }


.face{position:relative; cursor:pointer; will-change:transform}
.face .closed,.face .half{position:absolute; left:0; top:0; opacity:0}
.face.f-half .half{opacity:1}
.face.f-closed .closed{opacity:1}


.controls{position:fixed; z-index:5; top:calc(14px + env(safe-area-inset-top, 0px)); right:max(16px, env(safe-area-inset-right, 0px)); display:flex; gap:8px; align-items:center}
.controls .lang{position:static}
.theme button{display:grid; place-items:center; padding:6px 9px}
.share button{display:grid; place-items:center; padding:6px 9px}
.share svg{width:16px; height:16px}
.cta{display:flex; justify-content:center; margin-top:16px}
.cta .cbtn{padding:11px 20px; font-size:15px; font-weight:600; border-radius:999px; box-shadow:0 10px 30px -14px rgba(30,40,80,.45)}
.cta .cbtn small{font-size:12px; font-weight:600; opacity:.6; margin-left:2px}
@media (prefers-reduced-motion:no-preference){.cta .cbtn{transition:transform .15s ease}.cta .cbtn:hover{transform:translateY(-1px)}}
.toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); transform:translate(-50%, 20px); z-index:20;
  background:var(--ink); color:var(--bg); font-size:14px; font-weight:500; padding:10px 18px; border-radius:999px; opacity:0; pointer-events:none;
  transition:opacity .2s ease, transform .2s ease; box-shadow:0 12px 30px -12px rgba(0,0,0,.4)}
.toast.show{opacity:1; transform:translate(-50%, 0)}
.theme svg{width:16px; height:16px}


.answer .adisc{display:block; margin-top:8px; font-size:12px; color:var(--muted)}
.answer.loading #at{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){ .answer.loading #at{animation:pulse 1.2s ease-in-out infinite} @keyframes pulse{50%{opacity:.45}} }


.cgrid{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px}
.ccard{background:var(--surface-2); border-radius:16px; padding:16px 18px; display:grid; gap:10px; min-width:0; align-content:start}
.clabel{font-size:12.5px; color:var(--muted)}
.ccard code{font-family:inherit; font-size:17px; font-weight:600; user-select:all; word-break:break-all}
.cactions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.cbtn{display:inline-flex; align-items:center; gap:6px; font:inherit; font-size:14px; font-weight:500; text-decoration:none; color:var(--ink);
  background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:8px 12px; cursor:pointer}
.cbtn svg{width:16px; height:16px; flex:none}
.cbtn:hover{border-color:var(--muted)}
.cbtn.primary{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.cbtn.tg{background:#229ED9; color:#fff; border-color:#229ED9}
.cbtn.wa{background:#25D366; color:#fff; border-color:#25D366}
.cbtn.li{background:#0A66C2; color:#fff; border-color:#0A66C2}
.cbtn.hh{background:#D6001C; color:#fff; border-color:#D6001C}
.hhico{font-weight:800; font-size:13px; line-height:1; letter-spacing:-.02em}
@media (max-width:640px){ .cgrid{grid-template-columns:1fr} }

.facts.facts3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){ .facts.facts3{grid-template-columns:1fr} }

footer{position:relative; z-index:1; text-align:center; color:var(--muted); font-size:13px; margin-top:36px}

@media (max-width:760px){
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .facts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .groups{grid-template-columns:1fr}
}
@media (max-width:460px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){ .hero{padding-top:76px} }

/* Анимация входа: только при первой загрузке и если не включено «уменьшение движения» */
@keyframes inUp{from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none}}
@keyframes inFade{from{opacity:0} to{opacity:1}}
@keyframes wipe{from{clip-path:inset(-20% 100% -20% 0); filter:blur(10px); opacity:.2} 60%{filter:blur(2px); opacity:1} to{clip-path:inset(-20% -5% -20% 0); filter:none; opacity:1}}
@keyframes pop{0%{opacity:0; scale:.55} 55%{opacity:1; scale:1.07} 75%{scale:.97} 100%{opacity:1; scale:1}}
@keyframes spread{from{opacity:0; letter-spacing:.25em} to{opacity:1; letter-spacing:-.04em}}
html.intro .hello{animation:inUp .7s cubic-bezier(.2,.8,.2,1) .1s both}
html.intro h1{animation:wipe 1s cubic-bezier(.6,0,.2,1) .2s both}
html.intro .face{animation:pop .9s cubic-bezier(.2,.8,.2,1) .75s both, bob 6s ease-in-out 1.7s infinite}
html.intro .watermark{animation:spread 1.8s cubic-bezier(.2,.8,.2,1) .3s both}
html.intro .ask{animation:inUp .7s cubic-bezier(.2,.8,.2,1) 1.15s both}
html.intro .chips .chip{animation:inUp .5s cubic-bezier(.2,.8,.2,1) both}
html.intro .chips .chip:nth-child(1){animation-delay:1.3s} html.intro .chips .chip:nth-child(2){animation-delay:1.36s}
html.intro .chips .chip:nth-child(3){animation-delay:1.42s} html.intro .chips .chip:nth-child(4){animation-delay:1.48s}
html.intro .chips .chip:nth-child(5){animation-delay:1.54s}
html.intro .hint{animation:inFade .6s ease 1.6s both}
html.intro .cta{animation:inUp .6s cubic-bezier(.2,.8,.2,1) 1.6s both}
html.intro .tile{animation:inUp .6s cubic-bezier(.2,.8,.2,1) both}
html.intro .tile:nth-child(1){animation-delay:1.45s} html.intro .tile:nth-child(2){animation-delay:1.51s}
html.intro .tile:nth-child(3){animation-delay:1.57s} html.intro .tile:nth-child(4){animation-delay:1.63s}
html.intro .tile:nth-child(5){animation-delay:1.69s} html.intro .tile:nth-child(6){animation-delay:1.75s}
html.intro .panel{animation:inUp .8s cubic-bezier(.2,.8,.2,1) 1.85s both}
html.intro .controls{animation:inFade .8s ease 1.2s both}
</style>

<div class="bg" aria-hidden="true">
  <div class="blob b1"></div><div class="blob b3"></div>
</div>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="watermark" aria-hidden="true">Gabbassov</div>

<div class="controls">

  <h2>Мой путь</h2>
  <p class="sub">За 5,7 лет: от бизнес-аналитика в одной клинике до ведущего аналитика государственной системы для всей страны</p>
  <div class="scale" aria-label="Как рос масштаб">
    <div><b>~500</b><span>пользователей в одном онкоцентре</span></div>
    <div><b>до 1 000</b><span>человек под мониторингом на одной шахте</span></div>
    <div><b>10–15 тыс.</b><span>пользователей DMMS: 30+ шахт, рудников и фабрик в Казахстане и СНГ</span></div>
    <div><b>10–30 тыс.</b><span>пользователей госсистемы по всему Казахстану</span></div>
  </div>

  <div class="path">
    <div class="stage" style="--dot:#14b8a6">
      <div class="when">март 2021 – май 2022 · Cushpen Group</div>
      <h3>Старт: медицина и первые внедрения</h3>
      <span class="lvl">Бизнес-аналитик</span>
      <p>Пришёл в продуктовую команду медицинской информационной системы «Авиценна» и вёл её внедрение в Национальном научном онкологическом центре: требования, постановки, доработки, вплоть до ввода в эксплуатацию.</p>
      <div class="nums"><span><b>~500</b> врачей и сотрудников</span><span><b>1 000+</b> пациентов в месяц</span><span><b>3</b> интеграции: лаборатория, донорская система, PACS</span></div>
      <p class="learn"><b>Чему научился:</b> говорить с пользователями на их языке, превращать нормы законодательства в требования, учить людей работать в новой системе.</p>
    </div>

    <div class="stage" style="--dot:#16a34a">
      <div class="when">май 2022 – 2023 · AG TECH</div>
      <h3>Переход в системный анализ и промышленность</h3>
      <span class="lvl">Системный аналитик</span>
      <p>Пришёл в команду DMMS, когда это ещё был стартап. Горнодобыча и высоконагруженные данные: спроектировал подсистему позиционирования персонала и аварийного оповещения в шахтах. От неё зависит безопасность людей под землёй.</p>
      <div class="nums"><span><b>~200</b> событий в секунду на шахту</span><span><b>~17 млн</b> событий в сутки</span><span><b>до 1 000</b> человек под мониторингом</span></div>
      <p class="learn"><b>Чему научился:</b> проектировать интеграции и потоки данных, работать с оборудованием и асинхронным обменом, считать нагрузку.</p>
    </div>

    <div class="stage" style="--dot:#6366f1">
      <div class="when">2023 – май 2025 · AG TECH</div>
      <h3>Архитектура, команда и масштаб</h3>
      <span class="lvl">Ведущий системный аналитик → руководитель команды</span>

<script>
/* Запасной вариант: облегчённый след на 2D canvas (нет WebGL или включено «уменьшить движение») */
function fallback2D(cv){
  cv.classList.add('soft');
  var ctx = cv.getContext('2d'); if(!ctx) return;
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var S = 0.5, W = 0, H = 0;
  function size(){ W = Math.ceil(innerWidth*S); H = Math.ceil(innerHeight*S); cv.width = W; cv.height = H; }
  size(); addEventListener('resize', size);
  var parts = [], hue = 300, last = null, lastMove = 0, t0 = performance.now();
  var palette = [300, 325, 345, 250, 220, 20];
  function color(h, a){ return 'hsla(' + h + ',95%,58%,' + a + ')'; }
  function emit(x, y, dx, dy, n){
    for(var i=0;i<n;i++){
      hue = (hue + 0.6) % 360;
      var base = palette[Math.floor((performance.now()/900 + i*0.3) % palette.length)];
      parts.push({x:x*S, y:y*S, vx:dx*S*0.22 + (Math.random()-.5)*0.6, vy:dy*S*0.22 + (Math.random()-.5)*0.6,
        r:14 + Math.random()*16, life:1, h:base + (Math.random()-.5)*20});
    }
    if(parts.length > 420) parts.splice(0, parts.length - 420);
  }
  addEventListener('pointermove', function(e){
    var x = e.clientX, y = e.clientY;
    if(last){ var dx = x - last.x, dy = y - last.y; var d = Math.hypot(dx, dy); if(d > 2) emit(x, y, dx, dy, Math.min(4, 1 + d/18)); }
    last = {x:x, y:y}; lastMove = performance.now();
  }, {passive:true});
  addEventListener('pointerdown', function(e){ emit(e.clientX, e.clientY, 0, 0, 14); lastMove = performance.now(); }, {passive:true});

  function frame(now){
    // фантомный курсор, пока пользователь не двигает мышь (и на телефонах)
    if(now - lastMove > 2500){
      var t = (now - t0)/1000;
      var px = innerWidth*(0.16 + 0.10*Math.sin(t*0.7)), py = innerHeight*(0.22 + 0.16*Math.sin(t*1.1 + 1));
      var vx = innerWidth*0.07*Math.cos(t*0.7), vy = innerHeight*0.17*Math.cos(t*1.1 + 1);
      if(Math.random() < 0.6) emit(px, py, vx*0.05, vy*0.05, 1);
    }
    ctx.clearRect(0, 0, W, H);
    for(var i = parts.length - 1; i >= 0; i--){
      var p = parts[i];
      p.x += p.vx; p.y += p.vy; p.vx *= 0.965; p.vy *= 0.965; p.r += 0.55; p.life -= 0.009;
      if(p.life <= 0){ parts.splice(i, 1); continue; }
      var g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r);
      g.addColorStop(0, color(p.h, 0.42*p.life));
      g.addColorStop(1, color(p.h, 0));
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  if(reduce){
    // статичный цветной след без анимации
    for(var k=0;k<60;k++){ emit(innerWidth*(0.08 + k*0.004), innerHeight*(0.1 + k*0.006), 1, 1, 1); }
    parts.forEach(function(p){ p.life = 0.8; p.r += 30; });
    ctx.clearRect(0,0,W,H);
    parts.forEach(function(p){ var g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r); g.addColorStop(0,color(p.h,.3)); g.addColorStop(1,color(p.h,0)); ctx.fillStyle=g; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill(); });
  } else {
    requestAnimationFrame(frame);
  }
}

      {q:'Ең мықты жобаң қандай?', k:['жоба','кейс','мықты','мақтан','нәтиже'],
       a:'Құрылыстың бірыңғай порталын бүкіл Қазақстан бойынша тәжірибелік-өнеркәсіптік пайдалануға шығару: 6 айда негізгі бэклог жабылды, 2026 жылдың басынан жүйе арқылы 20 000-нан астам өтінім өтті.'},
      {q:'ЖИ-ді қалай қолданасың?', k:['жи','ии','ai','нейро','claude','gpt','агент'],
       a:'Өз агенттерімді және жобалық білім базасын баптаймын. Солардың көмегімен талаптар мен тапсырмаларды тексеремін және қайшылықтар мен жіберілген сценарийлерді әзірлеуге бергенге дейін табамын. Соңғы шешім әрқашан менде.'},
      {q:'Қандай құжаттар жазасың?', k:['құжат','тт','гост','сбб','нұсқаулық','спецификац','use case'],
       a:'Техникалық тапсырма мен спецификациялар, Use Case, BPMN және UML модельдері, API спецификациялары, сынақ бағдарламасы мен әдістемесі, пайдаланушы мен әкімші нұсқаулықтары, оқыту мен көрсетілімге арналған материалдар.'},
      {q:'Көшуге дайынсың ба?', k:['көш','шетел','қашықтан','формат','гибрид','релокац'],
       a:'Иә. Қазақстандағы және шетелдегі ұсыныстарды қарастырамын: кеңсе, гибрид және қашықтан жұмыс форматтары қолайлы.'},
      {q:'Неге кетіп жатырсың?', k:['кет','неге','ауыс','қазіргі'],
       a:'Жоба өз мақсатына жетті: жүйе пайдалануға енгізіліп, сүйемелдеуге берілді. Мен тек қолдау емес, жүйелерді дамытумен айналысқым келеді.'},
      {q:'Команда басқардың ба?', k:['команда','басқар','тимлид','лид','жетекш'],
       a:'Иә, AG TECH-те 10–12 адамға дейінгі команданы басқардым: аналитиктер, backend, frontend, QA. Тапсырма үлгілері мен аналитиканы тексеруді енгіздім, сөйтіп тапсырма дайындау уақыты 40%-ға қысқарды. Үш тағылымдамашыны дербес аналитик етіп дайындадым.'}
    ],
    en:[
      {q:'What is your experience?', k:['experience','years','who are you','about you','background','tell me','taiman','who is'],
       a:'5.7 years in systems and business analysis: a national government system for the construction industry, a production management system for mining, and a medical information system. I take work from requirements all the way to launch and user training.'},
      {q:'How have you grown?', k:['grow','grew','path','career','progress','journey'],
       a:'I started as a business analyst on a medical system for one cancer center (~500 users). Then I became a systems analyst in mining, grew to lead analyst and team lead: 30+ sites. Now I am the lead analyst of a government system for the whole country: 20,000+ applications in 2026.'},
      {q:'What about integrations?', k:['integrat','api','rest','soap','grpc','rabbit','gateway'],
       a:'I design synchronous and asynchronous integrations: REST, SOAP, gRPC, RabbitMQ, exchanges with government databases through the e-gov gateway. I describe contracts, errors, retries and duplicate protection. Latest example: after I redesigned the integration with private expert organizations, support tickets dropped 5×.'},
      {q:'What is your strongest project?', k:['project','case','strongest','proud','result','achievement'],
       a:'Bringing the Unified Construction Portal to pilot operation across Kazakhstan: we closed the key backlog in 6 months, and since early 2026 more than 20,000 applications have gone through the system.'},
      {q:'How do you use AI?', k:['ai','llm','claude','gpt','agent','artificial'],
       a:'I build my own agents and a project knowledge base. With them I review requirements and specs, catching contradictions and missing scenarios before development. The final decision is always mine.'},
      {q:'What documents do you write?', k:['document','spec','srs','guide','test','use case','requirement'],
       a:'Technical specifications and SRS, use cases, BPMN and UML models, API specifications, acceptance test programs, user and admin guides, training and demo materials.'},
      {q:'Are you open to relocation?', k:['relocat','move','abroad','remote','hybrid','visa','office'],
       a:'Yes. I am considering offers in Kazakhstan and abroad; office, hybrid and remote all work for me.'},
      {q:'Why are you leaving?', k:['leav','why','change','current','switch'],
       a:'The project achieved its goal: the system is live and handed over to support. I want to keep building and evolving systems, not only maintain them.'},
      {q:'Have you led a team?', k:['team','lead','manag','mentor','people'],
       a:'Yes, at AG TECH I led a team of up to 10–12 people: analysts, backend, frontend, QA. I introduced spec templates and analysis reviews, and spec preparation time dropped by 40%. I grew three interns into independent analysts.'}
    ]
  };

  var lang = 'ru', current = 'path';
  try { var saved = localStorage.getItem('lang'); if(saved && UI[saved]) lang = saved; } catch(e){}
  if(!UI[lang]) lang = 'ru';

  var panel = document.getElementById('panel');
  var tabs = document.querySelectorAll('.tile');
  var langBtns = document.querySelectorAll('.lang [data-lang]');
  var chips = document.getElementById('chips');
  var box = document.getElementById('answer'), aq = document.getElementById('aq'), at = document.getElementById('at');

  function track(name, data){
    try { if(window.va) window.va('event', {name:name, data:data||{}}); } catch(e){}
    try { if(window.ym && window.YM_ID) window.ym(window.YM_ID, 'reachGoal', name, data||{}); } catch(e){}
  }
  function show(name){
    current = name;
    var tpl = document.getElementById('tpl-' + name + '-' + lang) || document.getElementById('tpl-' + name + '-ru');
    panel.innerHTML = '';
    panel.appendChild(tpl.content.cloneNode(true));
    tabs.forEach(function(t){ t.setAttribute('aria-selected', t.dataset.tab === name ? 'true' : 'false'); });
    bindCopy();
  }
  function bindCopy(){
    panel.querySelectorAll('[data-copy]').forEach(function(b){
      b.addEventListener('click', function(){
        var id = b.dataset.copy, el = document.getElementById(id), ok = panel.querySelector('[data-ok="'+id+'"]');
        var done = function(){ ok.hidden = false; setTimeout(function(){ ok.hidden = true; }, 1500); };
        var sel = function(){ var r=document.createRange(); r.selectNodeContents(el); var s=window.getSelection(); s.removeAllRanges(); s.addRange(r); };
        try { navigator.clipboard.writeText(el.textContent.trim()).then(done, sel); } catch(e){ sel(); }
      });
    });
  }
  function answer(q, a){ aq.textContent = q; at.textContent = a; box.hidden = false; }
  function buildChips(){
    chips.innerHTML = '';
    QA[lang].slice(0,5).forEach(function(item){
      var b = document.createElement('button'); b.type='button'; b.className='chip'; b.textContent=item.q;
      b.addEventListener('click', function(){ answer(item.q, item.a); track('chip_click', {q:item.q.slice(0,60), lang:lang}); });
      chips.appendChild(b);
    });
  }
  var CV = {ru:'Gabbassov_Taiman_Senior_System_Analyst_RU.pdf', kk:'Gabbassov_Taiman_Senior_System_Analyst_KZ.pdf', en:'Gabbassov_Taiman_Senior_System_Analyst_EN.pdf'};
  var SITE = 'https://taiman-gabbassov.vercel.app/';
  var toastEl = null, toastT;
  function toast(msg){
    if(!toastEl){ toastEl = document.createElement('div'); toastEl.className = 'toast'; toastEl.setAttribute('role','status'); document.body.appendChild(toastEl); }
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function(){ toastEl.classList.remove('show'); }, 2000);
  }
  function copyText(t){
    if(navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
    return new Promise(function(ok, fail){
      var ta = document.createElement('textarea'); ta.value = t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? ok() : fail(); } catch(e){ fail(e); }
      document.body.removeChild(ta);
    });
  }
  var shareBtn = document.getElementById('shareBtn');
  if(shareBtn) shareBtn.addEventListener('click', function(){
    var touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
    if(navigator.share && touch){
      navigator.share({title: UI[lang].share_text, text: UI[lang].share_text, url: SITE}).then(function(){ track('share', {method:'native', lang:lang}); }, function(){});
    } else {
      copyText(SITE).then(function(){ toast(UI[lang].copied); track('share', {method:'copy', lang:lang}); }, function(){ toast(SITE); });
    }
  });
  function applyLang(l){
    var cvb = document.getElementById('cvBtn'); if(cvb && CV[l]){ cvb.setAttribute('href', CV[l]); cvb.setAttribute('download', CV[l]); }
    lang = l;
    try { localStorage.setItem('lang', l); } catch(e){}
    document.documentElement.lang = l;
    var d = UI[l];
    document.querySelectorAll('[data-i18n]').forEach(function(el){ el.textContent = d[el.dataset.i18n]; });
    document.querySelectorAll('[data-i18n-ph]').forEach(function(el){ el.placeholder = d[el.dataset.i18nPh]; });
    document.querySelectorAll('[data-i18n-aria]').forEach(function(el){ el.setAttribute('aria-label', d[el.dataset.i18nAria]); if(el.hasAttribute('title')) el.title = d[el.dataset.i18nAria]; });
    langBtns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.lang === l ? 'true' : 'false'); });
    box.hidden = true;
    buildChips();
    show(current);
  }

  tabs.forEach(function(t){ t.addEventListener('click', function(){ show(t.dataset.tab); track('tab_open', {tab:t.dataset.tab, lang:lang}); }); });
  langBtns.forEach(function(b){ b.addEventListener('click', function(){ applyLang(b.dataset.lang); track('lang_switch', {lang:b.dataset.lang}); }); });
  document.addEventListener('click', function(e){
    var a = e.target.closest && e.target.closest('a[href]'); if(!a) return;
    var h = a.getAttribute('href'), kind = null;
    var rm = /_(RU|KZ|EN)\.pdf$/.exec(h); if(rm) kind = 'resume_' + rm[1].toLowerCase();
    else if(/^mailto:/.test(h)) kind = 'email'; else if(/t\.me\//.test(h)) kind = 'telegram';
    else if(/wa\.me\//.test(h)) kind = 'whatsapp'; else if(/linkedin\.com/.test(h)) kind = 'linkedin'; else if(/hh\.kz/.test(h)) kind = 'hh';
    if(kind) track(kind.indexOf('resume') === 0 ? 'resume_download' : 'contact_click', {target:kind, lang:lang});
  }, true);
  function localAnswer(v){
    var low = v.toLowerCase(), best = null, score = 0;
    var PERSONAL = /сколько (тебе|вам) лет|сколько лет (тебе|вам)|возраст|год рождения|какого года|жена|женат|дети|семья|қанша жас|неше жас|жасың|жасыңыз|туған жыл|how old|your age|married|wife|kids|children|family/;
    if(PERSONAL.test(low)) return UI[lang].personal;
    [lang].concat(['ru','kk','en'].filter(function(x){ return x !== lang; })).forEach(function(L){
      QA[L].forEach(function(item, i){
        var sc = item.k.filter(function(k){ return low.indexOf(k) !== -1; }).length;
        if(sc > score){ score = sc; best = QA[lang][i]; }
      });
    });
    return best ? best.a : UI[lang].fallback;
  }
  var history = [], asking = false;
  var sid = Math.random().toString(36).slice(2, 7);
  var disc = document.getElementById('adisc');
  document.getElementById('askForm').addEventListener('submit', function(e){
    e.preventDefault();
    var input = document.getElementById('q');
    var v = input.value.trim(); if(!v || asking) return;
    asking = true; box.classList.add('loading'); track('ai_question', {lang:lang});
    answer(v, UI[lang].thinking); disc.hidden = true;
    var ctrl = ('AbortController' in window) ? new AbortController() : null;
    var timer = setTimeout(function(){ if(ctrl) ctrl.abort(); }, 25000);
    fetch('/api/chat', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question:v, lang:lang, history:history, sid:sid}), signal: ctrl ? ctrl.signal : undefined})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        if(!d || !d.answer) throw new Error('empty');
        answer(v, d.answer); disc.hidden = false;
        history.push({role:'user', content:v}, {role:'assistant', content:d.answer});
        history = history.slice(-6); input.value = '';
      })
      .catch(function(){ answer(v, localAnswer(v)); })
      .then(function(){ clearTimeout(timer); asking = false; box.classList.remove('loading'); });
  });
  applyLang(lang);
})();

/* моргание при наведении на лицо: открыт → полузакрыт → закрыт → полузакрыт → открыт */
(function(){
  var f = document.getElementById('face'); if(!f) return;
  var busy = false;
  function set(c){ f.classList.remove('f-half','f-closed'); if(c) f.classList.add(c); }
  function blink(done){
    if(busy) return; busy = true;
    set('f-half');
    setTimeout(function(){ set('f-closed'); }, 45);
    setTimeout(function(){ set('f-half'); }, 130);
    setTimeout(function(){ set(null); busy = false; if(done) done(); }, 180);
  }
  function double(){ blink(function(){ setTimeout(blink, 90); }); }
  if(document.documentElement.classList.contains('intro')) setTimeout(double, 1500);
  setTimeout(function(){ document.documentElement.classList.remove('intro'); }, 3200);
  f.addEventListener('mouseenter', double);
  f.addEventListener('click', double);
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){ (function loop(){ setTimeout(function(){ blink(); loop(); }, 3500 + Math.random()*4000); })(); }
})();

/* переключатель темы: светлая / как в системе / тёмная */
(function(){
  var root = document.documentElement, host = root.getAttribute('data-theme');
  var btns = document.querySelectorAll('[data-theme-set]');
  function apply(m){
    if(m === 'auto'){ if(host) root.setAttribute('data-theme', host); else root.removeAttribute('data-theme'); }
    else root.setAttribute('data-theme', m);
    btns.forEach(function(b){ b.setAttribute('aria-pressed', b.dataset.themeSet === m ? 'true' : 'false'); });
    try { localStorage.setItem('theme', m); } catch(e){}
  }
  var m = 'auto';
  try { m = localStorage.getItem('theme') || 'auto'; } catch(e){}
  if(['auto','light','dark'].indexOf(m) < 0) m = 'auto';
  btns.forEach(function(b){ b.addEventListener('click', function(){ apply(b.dataset.themeSet); }); });
  apply(m);
})();
